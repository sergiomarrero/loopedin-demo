<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>LoopedIn Vox — Live Insights</title>
  <meta name="description" content="LoopedIn Vox turns anonymized community-research responses into live insights: emerging themes, urgent signals, sentiment and demographics. A Rebel One (RBL1) tool." />
  <meta name="author" content="Rebel One (RBL1)" />
  <meta name="theme-color" content="#0e1116" />
  <!-- Internal RBL1 dashboard — keep it out of search indexes. -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- Favicons (themed SVG + raster fallbacks for Safari / link unfurlers).
       Namespaced under /vox so they never collide with the main LoopedIn site's
       root favicon / og image. -->
  <link rel="icon" type="image/svg+xml" href="/vox/favicon.svg" />
  <link rel="alternate icon" type="image/png" sizes="32x32" href="/vox/favicon-32.png" />
  <link rel="alternate icon" type="image/png" sizes="96x96" href="/vox/favicon-96.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/vox/apple-touch-icon.png" />
  <link rel="mask-icon" href="/vox/favicon.svg" color="#58a6ff" />

  <!-- Open Graph / Twitter — make shared links render a real, branded preview -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="LoopedIn Vox" />
  <meta property="og:title" content="LoopedIn Vox — Live community-research insights" />
  <meta property="og:description" content="Emerging themes, urgent signals, sentiment and demographics — synthesized from anonymized responses." />
  <meta property="og:image" content="/vox/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="LoopedIn Vox — Live community-research insights" />
  <meta name="twitter:description" content="Emerging themes, urgent signals, sentiment and demographics — synthesized from anonymized responses." />
  <meta name="twitter:image" content="/vox/og.png" />

  <script type="module" src="/src/vox/main.tsx"></script>
</head>
<body>
<div id="root"></div>
</body>
</html>
