<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280">
  <rect width="720" height="1280" fill="#FBF7EF"/>
  <text x="80" y="130" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#2E3524">Nutrition Facts</text>
  <line x1="80" y1="160" x2="640" y2="160" stroke="#2E3524" stroke-width="10"/>
  <text x="80" y="220" font-family="Arial, sans-serif" font-size="28" fill="#2E3524">Serving size: 1 bottle (12 fl oz)</text>
  <line x1="80" y1="250" x2="640" y2="250" stroke="#2E3524" stroke-width="4"/>
  <text x="80" y="320" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#2E3524">Calories</text>
  <text x="640" y="320" text-anchor="end" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#2E3524">120</text>
  <line x1="80" y1="350" x2="640" y2="350" stroke="#2E3524" stroke-width="8"/>
  <g font-family="Arial, sans-serif" font-size="28" fill="#2E3524">
    <text x="80" y="410">Total Fat</text><text x="640" y="410" text-anchor="end">0g</text>
    <line x1="80" y1="430" x2="640" y2="430" stroke="#C9BFA9" stroke-width="2"/>
    <text x="80" y="480">Sodium</text><text x="640" y="480" text-anchor="end">15mg</text>
    <line x1="80" y1="500" x2="640" y2="500" stroke="#C9BFA9" stroke-width="2"/>
    <text x="80" y="550" font-weight="bold">Total Sugars</text><text x="640" y="550" text-anchor="end" font-weight="bold">24g</text>
    <text x="110" y="596" font-size="24" fill="#6B635E">Includes 0g Added Sugars</text>
    <line x1="80" y1="620" x2="640" y2="620" stroke="#C9BFA9" stroke-width="2"/>
    <text x="80" y="670">Protein</text><text x="640" y="670" text-anchor="end">1g</text>
  </g>
  <line x1="80" y1="700" x2="640" y2="700" stroke="#2E3524" stroke-width="8"/>
  <text x="80" y="770" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#2E3524">INGREDIENTS:</text>
  <text x="80" y="812" font-family="Arial, sans-serif" font-size="24" fill="#4A443F">Apple juice, spinach juice, kale juice,</text>
  <text x="80" y="848" font-family="Arial, sans-serif" font-size="24" fill="#4A443F">lemon juice, natural flavors.</text>
  <rect x="80" y="920" width="560" height="150" rx="16" fill="#EDF3DC"/>
  <text x="110" y="978" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#3E4A2E">SNAP / EBT eligible</text>
  <text x="110" y="1020" font-family="Arial, sans-serif" font-size="24" fill="#5A6247">Accepted at participating stores.</text>
</svg>
