<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280">
  <rect width="720" height="1280" fill="#EEF1F4"/>
  <!-- phone frame -->
  <rect x="90" y="60" width="540" height="1160" rx="48" fill="#101418"/>
  <rect x="106" y="76" width="508" height="1128" rx="36" fill="#FFFFFF"/>
  <!-- app header -->
  <rect x="106" y="76" width="508" height="150" rx="36" fill="#1C4E80"/>
  <rect x="106" y="160" width="508" height="66" fill="#1C4E80"/>
  <text x="150" y="176" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#FFFFFF">BenefitTrack</text>
  <!-- balance card -->
  <rect x="140" y="260" width="440" height="180" rx="20" fill="#F2F7FC" stroke="#D5E2EE" stroke-width="2"/>
  <text x="170" y="322" font-family="Arial, sans-serif" font-size="26" fill="#5B6B7A">SNAP balance</text>
  <text x="170" y="392" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#12283A">$214.60</text>
  <!-- renewal warning -->
  <rect x="140" y="470" width="440" height="120" rx="20" fill="#FFF4E5" stroke="#F5D9AE" stroke-width="2"/>
  <text x="170" y="520" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#8A5A17">Renewal due in 12 days</text>
  <text x="170" y="560" font-family="Arial, sans-serif" font-size="24" fill="#8A6A3A">Tap to upload your documents</text>
  <!-- menu rows -->
  <g font-family="Arial, sans-serif" font-size="28" fill="#12283A">
    <rect x="140" y="630" width="440" height="96" rx="16" fill="#F7F9FB"/>
    <text x="170" y="688">Find stores near me</text>
    <rect x="140" y="746" width="440" height="96" rx="16" fill="#F7F9FB"/>
    <text x="170" y="804">Report a lost card</text>
    <rect x="140" y="862" width="440" height="96" rx="16" fill="#F7F9FB"/>
    <text x="170" y="920">Message a caseworker</text>
  </g>
  <!-- tab bar -->
  <line x1="106" y1="1080" x2="614" y2="1080" stroke="#E2E8EE" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="22" fill="#8795A2" text-anchor="middle">
    <text x="200" y="1150">Home</text>
    <text x="360" y="1150">Balance</text>
    <text x="520" y="1150">Help</text>
  </g>
</svg>
