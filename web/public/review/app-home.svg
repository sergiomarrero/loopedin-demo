<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280">
  <!-- Full-bleed app screenshot (no outer frame): fills the review screen cleanly. -->
  <rect width="720" height="1280" fill="#FFFFFF"/>
  <!-- app header -->
  <rect x="0" y="0" width="720" height="190" fill="#1C4E80"/>
  <text x="56" y="120" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF">BenefitTrack</text>
  <text x="56" y="166" font-family="Arial, sans-serif" font-size="26" fill="#B9CFE2">Good morning</text>
  <!-- balance card -->
  <rect x="48" y="230" width="624" height="220" rx="24" fill="#F2F7FC" stroke="#D5E2EE" stroke-width="2"/>
  <text x="84" y="300" font-family="Arial, sans-serif" font-size="30" fill="#5B6B7A">SNAP balance</text>
  <text x="84" y="392" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#12283A">$214.60</text>
  <!-- renewal warning -->
  <rect x="48" y="490" width="624" height="150" rx="24" fill="#FFF4E5" stroke="#F5D9AE" stroke-width="2"/>
  <text x="84" y="552" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#8A5A17">Renewal due in 12 days</text>
  <text x="84" y="600" font-family="Arial, sans-serif" font-size="27" fill="#8A6A3A">Tap to upload your documents</text>
  <!-- menu rows -->
  <g font-family="Arial, sans-serif" font-size="32" fill="#12283A">
    <rect x="48" y="690" width="624" height="116" rx="20" fill="#F7F9FB"/>
    <text x="84" y="760">Find stores near me</text>
    <rect x="48" y="830" width="624" height="116" rx="20" fill="#F7F9FB"/>
    <text x="84" y="900">Report a lost card</text>
    <rect x="48" y="970" width="624" height="116" rx="20" fill="#F7F9FB"/>
    <text x="84" y="1040">Message a caseworker</text>
  </g>
  <!-- tab bar -->
  <line x1="0" y1="1140" x2="720" y2="1140" stroke="#E2E8EE" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="26" fill="#8795A2" text-anchor="middle">
    <text x="140" y="1218">Home</text>
    <text x="360" y="1218">Balance</text>
    <text x="580" y="1218">Help</text>
  </g>
  <g text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#1C4E80" font-weight="bold">
    <text x="140" y="1218">Home</text>
  </g>
</svg>
