<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoopedIn — Access Required</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #2E7D5F;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      text-align: center;
    }
    .logo {
      margin-bottom: 28px;
    }
    .logo svg {
      width: 64px;
      height: 64px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 14px;
      color: #666;
      margin-bottom: 28px;
    }
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 12px;
    }
    input[type="password"]:focus { border-color: #2E7D5F; }
    input[type="password"].error { border-color: #e53e3e; animation: shake 0.3s; }
    button {
      width: 100%;
      padding: 12px;
      background: #2E7D5F;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #256b50; }
    .err-msg {
      font-size: 13px;
      color: #e53e3e;
      margin-top: 10px;
      min-height: 18px;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect width="64" height="64" rx="14" fill="#2E7D5F"/>
        <g transform="translate(32 32)" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="-2" cy="-2" r="12" stroke-dasharray="62 8" stroke-dashoffset="0" transform="rotate(-15)"/>
          <path d="M -2 -2 L -2 12 L 12 12" stroke-width="4"/>
        </g>
      </svg>
    </div>
    <h1>LoopedIn</h1>
    <p>Enter the access password to continue.</p>
    <form id="form">
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
      <button type="submit">Access</button>
      <div class="err-msg" id="err"></div>
    </form>
  </div>

  <script>
    const HASH = '2e737c2291bc3c37863607197788b1306d4abaa0f67eba3308c97cc709499919';

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    document.getElementById('form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const pw = document.getElementById('pw');
      const err = document.getElementById('err');
      const hash = await sha256(pw.value);
      if (hash === HASH) {
        sessionStorage.setItem('li_auth', '1');
        window.location.href = 'app.html?v=4';
      } else {
        err.textContent = 'Incorrect password. Try again.';
        pw.classList.add('error');
        pw.value = '';
        setTimeout(() => pw.classList.remove('error'), 400);
      }
    });
  </script>
</body>
</html>
