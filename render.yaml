# Render Blueprint — deploys LoopedIn as a single web service that serves both
# the API and the built frontend from one origin (so the app's /api calls work
# with no proxy/CORS).
#
# To launch:
#   1. Push this repo to GitHub (done).
#   2. In Render: New + → Blueprint → pick this repo → Apply.
#   3. When prompted, paste DATABASE_URL = the Supabase "loopedin" project's
#      connection string (Supabase Dashboard → Connect → Direct connection or
#      Session pooler). See docs/supabase-backend.md.
#   4. Open the service URL. The landing page is at /, the member app at
#      /member.html, the orgs console at /orgs.html, Vox at /vox.html.
#
# The database is Supabase Postgres (project "loopedin", ref
# sygeaxmjmkwedwkvoopb) — persistent, already schema'd and seeded, so deploys
# and restarts keep all data. The build uses the postgres Prisma schema
# (server/prisma/schema.postgres.prisma); db push + seed are idempotent.
#
# SQLite fallback (no Supabase): set buildCommand back to `npm run deploy:build`
# and DATABASE_URL to file:./prod.db — ephemeral on the free tier.

services:
  - type: web
    name: loopedin
    runtime: node
    plan: free
    buildCommand: npm run deploy:build:supabase
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # paste the Supabase connection string when Render prompts
      - key: JWT_SECRET
        generateValue: true
      # ── Admin gate (hard launch blocker: admin fails CLOSED without it) ──
      - key: ADMIN_API_TOKEN
        generateValue: true # copy from Render dashboard into localStorage 'loopedin-admin-token' to use the admin console
      # ── Messaging layer (Twilio SMS-first, WhatsApp-ready) ──
      - key: TWILIO_ACCOUNT_SID
        sync: false # from Twilio Console
      - key: TWILIO_AUTH_TOKEN
        sync: false # from Twilio Console (also signs webhook validation)
      - key: TWILIO_SMS_FROM
        sync: false # your toll-free number, E.164 e.g. +18885551234
      - key: TWILIO_WHATSAPP_FROM
        sync: false # sandbox or approved WhatsApp sender, e.g. +14155238886
      - key: WHATSAPP_ENABLED
        value: "false" # flip to true when Meta approval lands
      - key: MESSAGING_DAILY_CAP
        value: "1" # max unsolicited outbound per member per day
      - key: PUBLIC_API_URL
        sync: false # this service's public URL, e.g. https://loopedin.onrender.com (webhook signature validation)
      - key: PUBLIC_APP_URL
        value: https://www.weloopedin.com # deep links in messages
